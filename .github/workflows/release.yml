name: Release

# Push a version tag (for example `git tag v1.0.0 && git push origin v1.0.0`) to build the portable
# exe and publish it as a GitHub Release.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+'] # vMAJOR.MINOR.PATCH only; the Version step checks it again

permissions:
  contents: write # create the release and upload its zip

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30 # a hung test, publish or runner fails fast instead of running for hours
    env:
      TAG: ${{ github.ref_name }} # passed as data, never pasted into the scripts
    steps:
      # Actions are pinned to full commit SHAs (supply-chain hardening); the tag is in the comment.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      - name: Version
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:TAG -notmatch '^v(\d+\.\d+\.\d+)$') { throw "Tag '$env:TAG' is not vMAJOR.MINOR.PATCH" }
          "version=$($Matches[1])" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test -c Release

      # Self-contained single file: runs on Windows 10 2004+ x64 without installing .NET.
      - name: Publish
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop' # any failing cmdlet fails the step (never zip a partial build)
          dotnet publish src/BatteryMonitor.App -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true -p:DebugType=none -p:Version=$env:VERSION -o publish
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path publish/BatteryMonitor.App.exe)) { throw "publish/BatteryMonitor.App.exe was not produced" }
          Rename-Item publish/BatteryMonitor.App.exe BatteryMonitor.exe
          Copy-Item README.md, LICENSE publish/
          Compress-Archive publish/* "BatteryMonitor-$env:VERSION-win-x64-portable.zip"

      # Re-running the workflow for the same tag replaces the zip instead of failing on an existing release.
      - name: Create or update release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = "BatteryMonitor-$env:VERSION-win-x64-portable.zip"
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG $zip --clobber
          } else {
            gh release create $env:TAG $zip --title "Battery Monitor $env:VERSION" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw "gh release failed with exit code $LASTEXITCODE" }
